name: build-windows

# 只构建 Windows 安装包
# 手动触发：Actions -> build-windows -> Run workflow（可指定版本号）
# 推送 tag（v*）时也会自动构建
on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，留空则使用 pubspec.yaml 里的版本（例如 1.11.8 或 1.11.8+11108）"
        required: false
        default: ""
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      # 签出代码
      - uses: actions/checkout@v4

      # 设置Flutter环境（与官方 CI 保持一致）
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      - name: Enable Flutter Desktop
        run: flutter config --enable-windows-desktop

      # 可选：覆盖版本号
      - name: Set Version
        if: ${{ github.event.inputs.version != '' }}
        shell: bash
        run: |
          cd simple_live_app
          sed -i -E "s/^version: .*/version: ${{ github.event.inputs.version }}/" pubspec.yaml
          grep '^version:' pubspec.yaml

      - name: Restore Packages
        run: |
          cd simple_live_app
          flutter pub get

      # 静态检查：失败不阻断构建，只作为提示（保留改动后的代码质量反馈）
      - name: Analyze
        continue-on-error: true
        run: |
          cd simple_live_app
          flutter analyze --no-fatal-infos

      # 设置flutter_distributor环境
      - name: Install flutter_distributor
        run: dart pub global activate flutter_distributor

      # build Windows ZIP\MSIX
      - name: Build Windows
        run: |
          cd simple_live_app
          flutter_distributor package --platform windows --targets msix,zip --skip-clean

      # 上传Windows至Artifacts
      - name: Upload Windows APP to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            simple_live_app/build/dist/*/*.msix
            simple_live_app/build/dist/*/*.zip

      - run: echo "Windows job's status is ${{ job.status }}."
